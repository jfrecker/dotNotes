<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dotNotes — Graph view</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/lib/tailwind/output.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="h-full bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen flex-col">
    <!-- Top bar -->
    <header class="flex flex-shrink-0 items-center gap-3 border-b border-slate-300 bg-white px-4 py-2 shadow-sm">
      <h1 class="text-lg font-semibold text-slate-800">dotNotes</h1>
      <span class="text-sm text-slate-500">Graph view</span>
      <span id="graph-status" class="text-sm text-slate-400"></span>
      <div class="ml-auto flex items-center gap-3">
        <div class="flex items-center gap-3 text-xs text-slate-500">
          <span class="flex items-center gap-1"><span class="graph-legend-dot graph-legend-dot--note"></span>Note</span>
          <span class="flex items-center gap-1"><span class="graph-legend-dot graph-legend-dot--missing"></span>Not created yet</span>
        </div>
        <button
          id="graph-refresh-btn"
          type="button"
          title="Re-fetch the graph (it doesn't update live if another tab edited a note)"
          class="rounded px-2 py-1 text-sm text-slate-500 hover:bg-slate-100"
        >
          Refresh
        </button>
        <a href="/index.html" class="rounded px-2 py-1 text-sm font-medium text-blue-600 hover:bg-slate-100">
          Back to notes
        </a>
      </div>
    </header>

    <!-- Force-directed graph canvas (hand-rolled - see js/graph.js) -->
    <main class="relative flex-1 overflow-hidden bg-white">
      <canvas id="graph-canvas" class="block h-full w-full cursor-grab"></canvas>
      <p id="graph-empty-message" class="pointer-events-none absolute inset-0 hidden items-center justify-center text-slate-400">
        No notes or links yet. Add a <code class="mx-1 rounded bg-slate-100 px-1">[[wikilink]]</code> to a note to see it here.
      </p>
    </main>
  </div>

  <!-- App scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/graph.js"></script>
</body>
</html>
